name: تحديث قوائم IPTV تلقائياً

on:
  schedule:
    # تشغيل كل 30 دقيقة للحفاظ على التوكنات صالحة
    - cron: '*/30 * * * *'
  
  # إمكانية التشغيل اليدوي
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout المستودع
      uses: actions/checkout@v3
      
    - name: إعداد Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: تثبيت المكتبات المطلوبة
      run: |
        pip install requests pycryptodome
    
    - name: تحديث قوائم البث
      run: |
        python update_playlists.py
    
    - name: Push إلى GitHub
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "تحديث تلقائي للقوائم $(date '+%Y-%m-%d %H:%M:%S')"
        branch: main