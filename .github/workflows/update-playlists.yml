name: تحديث قوائم IPTV تلقائياً

on:
  schedule:
    # تشغيل كل 30 دقيقة للحفاظ على التوكنات صالحة
    - cron: '*/30 * * * *'
  
  # إمكانية التشغيل اليدوي
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout المستودع
      uses: actions/checkout@v3
      
    - name: إعداد Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: تثبيت المكتبات المطلوبة
      run: |
        pip install requests pycryptodome
    
    - name: تحديث قوائم البث
      run: |
        python auto_update_playlists.py
    
    - name: إعداد Git
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
    
    - name: Commit التغييرات
      run: |
        git add -A
        git diff --staged --quiet || git commit -m "تحديث تلقائي للقوائم $(date '+%Y-%m-%d %H:%M:%S')"
    
    - name: Push إلى GitHub
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main